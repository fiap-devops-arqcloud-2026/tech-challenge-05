# =================================================================
# Job db-schema — bancos, usuários e schemas no RDS, sem kubectl manual
# =================================================================
# Hook PreSync do ArgoCD: roda ANTES de cada sincronização, então os bancos
# existem antes de os serviços novos subirem. Se o Job falhar, a
# sincronização falha e aparece no ArgoCD (nada de erro silencioso).
# BeforeHookCreation: o Job anterior só é apagado quando o próximo é criado,
# e o log da última execução continua disponível para conferência.
# O script e os arquivos SQL vêm do ConfigMap gerado em kustomization.yaml.
# =================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: db-schema
  labels:
    app.kubernetes.io/name: db-schema
    app.kubernetes.io/component: database-schema
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  # Teto de 5 min: o script espera o banco por até ~2,5 min.
  activeDeadlineSeconds: 300
  # Some do cluster 1 dia depois de terminar (o log fica disponível até lá);
  # a próxima sincronização cria outro de qualquer forma.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-schema
        app.kubernetes.io/component: database-schema
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # UID e GID do usuário "postgres" da imagem Alpine oficial.
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          # Mesma versão maior do RDS (PostgreSQL 17): o cliente psql é compatível.
          image: postgres:17.12-alpine3.24
          command: ["sh", "/schema/apply.sh"]
          envFrom:
            - secretRef:
                name: db-schema # criado pela raiz terraform/k8s
          env:
            # HOME gravável: o disco do contêiner é somente leitura.
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: schema
          configMap:
            name: db-schema-sql
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
