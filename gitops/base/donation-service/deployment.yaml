# =================================================================
# donation-service — processamento de doações (Go): o HOT PATH
# =================================================================
# Componente crítico da plataforma: 2 réplicas espalhadas por nós, com
# PodDisruptionBudget (pdb.yaml), para que a queda de um nó ou uma
# manutenção não interrompa as doações.
#
# O Secret "donation-service-db", o ConfigMap "aws-endpoints" (região e URL
# da fila) e a ServiceAccount "donation-service" (com a role IRSA que só
# pode publicar na fila) são criados pela raiz terraform/k8s.
# =================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
  labels:
    app.kubernetes.io/name: donation-service
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: donation-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: donation-service
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: donation-service
      # Sem token da API do Kubernetes. A credencial da AWS (IRSA) chega por
      # outro volume, injetado pelo EKS a partir da anotação da ServiceAccount.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # O serviço já faz desligamento gracioso (termina requisições e eventos
      # SQS em voo, até ~15 s); 30 s cobrem isso com folga.
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        # Uma réplica por nó sempre que possível.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: donation-service
      containers:
        - name: donation-service
          image: solidarytech/donation-service
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: donation-service-db
                  key: DATABASE_URL
          envFrom:
            # AWS_REGION e AWS_SQS_URL (a publicação na fila só liga com as duas).
            - configMapRef:
                name: aws-endpoints
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
