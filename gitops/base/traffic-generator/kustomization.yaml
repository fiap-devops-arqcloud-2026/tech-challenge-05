apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
configMapGenerator:
  # O sufixo de hash no nome faz o Deployment reiniciar sozinho quando o
  # script muda (o Kustomize atualiza a referência no volume).
  - name: traffic-generator-script
    files:
      - gerar-trafego.sh
